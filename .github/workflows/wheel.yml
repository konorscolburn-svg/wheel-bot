name: Wheel bot

on:
  schedule:
    - cron: "45 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "alpaca-py>=0.44"
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAPER: ${{ vars.PAPER || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          SELL_PUTS: ${{ vars.SELL_PUTS || 'true' }}
        run: python wheel_bot.py
      - name: Save trade log
        if: always()
        run: |
          if [ -f trades_log.csv ]; then
            git config user.name "wheel-bot"
            git config user.email "wheel-bot@users.noreply.github.com"
            git add trades_log.csv
            git commit -m "Trade log $(date -u +%F)" || true
            git push || true
          fi
