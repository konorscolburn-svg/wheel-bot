name: Crypto bot

on:
  schedule:
    # Every 30 minutes, 24/7 (crypto never closes). GitHub may start runs a few minutes late.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bots-git
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "alpaca-py>=0.44"
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAPER: "true"
          DRY_RUN: ${{ vars.CRYPTO_DRY_RUN || 'true' }}
          BOT_BUDGET: ${{ vars.CRYPTO_BUDGET || '100' }}
          NOTIFY_EVERY_RUN: ${{ vars.CRYPTO_NOTIFY_EVERY_RUN || 'false' }}
          CRYPTO_SYMBOLS: ${{ vars.CRYPTO_SYMBOLS || 'BTC/USD,ETH/USD,SOL/USD' }}
        run: python crypto_bot.py
      - name: Save trade log and state
        if: always()
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add -A
          git commit -m "Crypto bot run $(date -u +%F-%H%M)" || true
          git pull --rebase || true
          git push || true
